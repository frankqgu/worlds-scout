<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worlds Scout</title>
<style>
  :root{
    --bg:#0a0d17;--bg2:#10142409;--card:#121829;--card2:#182036;--line:#222b46;--text:#e6e9f7;--dim:#8a93b4;
    --win:#3ddc97;--loss:#ff5d6c;--gold:#f0c35c;--accent:#7c8cff;--radius:14px
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(1200px 500px at 10% -10%,#1b2450 0,transparent 60%),radial-gradient(900px 400px at 100% 0,#2a1b4a 0,transparent 55%),var(--bg);min-height:100vh}
  header{padding:22px 28px 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:22px;margin:0;letter-spacing:.3px;background:linear-gradient(90deg,#fff,#aab4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:12px}
  .bar{padding:12px 28px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .bar select,.bar input{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;outline:none}
  .bar select:focus,.bar input:focus{border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:18px;padding:0 28px 48px}
  .team{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:0 10px 30px #0006}
  .team h2{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:10px}
  .team h2 .tag{background:var(--accent);color:#0a0d17;font-weight:800;border-radius:8px;padding:2px 9px;font-size:13px}
  .team h2 .tr{margin-left:auto;font-weight:500;font-size:12px;color:var(--dim)}
  .wr{display:inline-block;height:5px;border-radius:3px;background:var(--loss);width:90px;vertical-align:middle;overflow:hidden;margin-left:8px}
  .wr i{display:block;height:100%;background:var(--win)}
  .player{padding:10px 0;border-top:1px solid var(--line)}
  .phead{display:flex;gap:10px;align-items:center}
  .ricon{width:22px;height:22px;flex:none;opacity:.9}
  .pname{font-weight:700;font-size:15px}
  .acct{color:var(--dim);font-size:11px}
  .rec{margin-left:auto;text-align:right;font-size:12px;color:var(--dim)}
  .rec b{color:var(--text);font-size:14px}
  .champs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .ch{width:46px;position:relative;text-align:center;font-size:10px;cursor:default}
  .ch img{width:46px;height:46px;border-radius:12px;display:block;border:2px solid var(--line);transition:transform .12s,border-color .12s;background:#000}
  .ch:hover img{transform:translateY(-2px) scale(1.06)}
  .ch.pos img{border-color:var(--win)} .ch.neg img{border-color:var(--loss)}
  .ch .n{position:absolute;top:-5px;right:-5px;background:#0b0f1d;border:1px solid var(--line);border-radius:9px;min-width:18px;padding:0 4px;font-size:10px;font-weight:700}
  .ch .wl{display:block;margin-top:2px;color:var(--dim);font-weight:600}
  .empty{color:var(--dim);font-size:12px;padding:6px 0}
  /* tooltip */
  .tip{position:fixed;z-index:10;pointer-events:none;background:#0b0f1ef2;backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:300px;box-shadow:0 18px 50px #000b;display:none}
  .th{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .th img{width:40px;height:40px;border-radius:10px}
  .th b{font-size:16px} .th span{display:block;color:var(--dim);font-size:11px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1a2240;font-size:13px}
  .row:last-of-type{border-bottom:0}
  .row .k{color:var(--dim)}
  .good{color:var(--win);font-weight:700} .bad{color:var(--loss);font-weight:700}
  .icons{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .icons img{width:24px;height:24px;border-radius:50%}
  .sec{margin-top:10px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .gicons{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .gicons img{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:#000}
  .gicons img.w{border-color:var(--win)} .gicons img.l{border-color:var(--loss)}
  .rune{background:#0007;border-radius:50%;padding:1px}
</style>
</head>
<body>
<header>
  <h1>Worlds Scout</h1>
  <span class="sub" id="meta"></span>
</header>
<div class="bar">
  <input id="q" placeholder="Search player or team…" size="22">
  <select id="team"><option value="">All teams</option></select>
  <select id="role"><option value="">All roles</option><option>Top</option><option>Jungle</option><option>Mid</option><option>Bot</option><option>Support</option></select>
  <select id="sort"><option value="team">Sort: team</option><option value="games">Sort: games played</option></select>
</div>
<div class="grid" id="grid"></div>
<div class="tip" id="tip"></div>
<script>
const DATA = /*__DATA__*/null;
const VER = "16.20.1";
const DD = `https://ddragon.leagueoflegends.com/cdn/${VER}/img/champion/`;
const RUNE_CDN = "https://ddragon.leagueoflegends.com/cdn/img/";
const grid = document.getElementById("grid"), tip = document.getElementById("tip");
const pct = (w, g) => g ? Math.round(100 * w / g) : 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wlClass = (w, g) => g >= 2 ? (w / g >= .6 ? "pos" : w / g <= .4 ? "neg" : "") : "";
const champImg = (n, cls = "", title = "") => `<img class="${cls}" src="${DD}${encodeURIComponent(n)}.png" alt="${esc(n)}" title="${esc(title || n)}" loading="lazy">`;

// rune id -> icon url (keystones and trees), loaded once from Data Dragon
const runeIcon = {};
fetch(`https://ddragon.leagueoflegends.com/cdn/${VER}/data/en_US/runesReforged.json`).then(r => r.json()).then(trees => {
  for (const t of trees) {
    runeIcon[t.id] = RUNE_CDN + t.icon;
    for (const s of t.slots) for (const r of s.runes) runeIcon[r.id] = RUNE_CDN + r.icon;
  }
}).catch(() => {});

const ROLE_SVG = {
  Top: '<path d="M4 4h10v2H6v8H4zM8 8h8v8H8z" fill="currentColor"/>',
  Jungle: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-5 4-6 5-10zM11 14h2v7h-2z" fill="currentColor"/>',
  Mid: '<path d="M4 18 18 4h2v2L6 20H4zM14 18h6v2h-8zM4 4h8v2H6v6H4z" fill="currentColor"/>',
  Bot: '<path d="M20 20H10v-2h8v-8h2zM4 4l10 0v2H6v8H4zM8 8h8v8H8z" fill="currentColor" opacity=".9"/>',
  Support: '<path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z" fill="currentColor"/>'
};
const roleIcon = r => `<svg class="ricon" viewBox="0 0 24 24" style="color:var(--accent)">${ROLE_SVG[r] || ""}</svg>`;
const PARTNER_LABEL = {Jungle: "Mid partner", Mid: "Jungle partner", Bot: "Support partner", Support: "ADC partner"};

// team picker
const teamSel = document.getElementById("team");
[...new Set(DATA.players.map(p => p.team))].sort().forEach(t => teamSel.insertAdjacentHTML("beforeend", `<option>${esc(t)}</option>`));

function render() {
  const role = document.getElementById("role").value, sort = document.getElementById("sort").value,
        team = teamSel.value, q = document.getElementById("q").value.trim().toLowerCase();
  const teams = {};
  for (const p of DATA.players) {
    if (role && p.role !== role) continue;
    if (team && p.team !== team) continue;
    if (q && !(p.handle.toLowerCase().includes(q) || p.team.toLowerCase().includes(q))) continue;
    (teams[p.team] ||= []).push(p);
  }
  const names = Object.keys(teams), total = t => teams[t].reduce((s, p) => s + p.games, 0);
  if (sort === "games") names.sort((a, b) => total(b) - total(a));
  grid.innerHTML = names.map(t => {
    const ps = teams[t], g = total(t), w = ps.reduce((s, p) => s + p.wins, 0);
    return `<section class="team"><h2><span class="tag">${esc(t)}</span><span class="tr">${w}-${g - w}<span class="wr"><i style="width:${pct(w, g)}%"></i></span> ${pct(w, g)}%</span></h2>${ps.map(playerHtml).join("")}</section>`;
  }).join("") || '<div class="empty">No matching players.</div>';
  document.getElementById("meta").textContent =
    `NA solo queue · last ${DATA.days} days · updated ${new Date(DATA.generatedAt).toLocaleString()}`;
}

function playerHtml(p) {
  const idx = DATA.players.indexOf(p);
  const chips = p.champions.map((c, i) =>
    `<div class="ch ${wlClass(c.wins, c.games)}" data-p="${idx}" data-c="${i}">${champImg(c.champion)}<span class="n">${c.games}</span><span class="wl">${c.wins}-${c.games - c.wins}</span></div>`).join("");
  return `<div class="player"><div class="phead">${roleIcon(p.role)}<div><div class="pname">${esc(p.handle)}</div><div class="acct">${esc(p.riotId)}${p.found ? "" : " · account not found"}</div></div>
    <div class="rec">${p.games ? `<b>${pct(p.wins, p.games)}%</b><br>${p.wins}-${p.games - p.wins}` : ""}</div></div>
    ${chips ? `<div class="champs">${chips}</div>` : '<div class="empty">No ranked games in window</div>'}</div>`;
}

function tipHtml(p, c) {
  const wc = wlClass(c.wins, c.games), wcl = wc === "pos" ? "good" : wc === "neg" ? "bad" : "";
  const gd = c.gd15 == null ? "–" : `<span class="${c.gd15 >= 0 ? "good" : "bad"}">${c.gd15 >= 0 ? "+" : ""}${c.gd15}</span>`;
  const runes = [...c.keystones.map(k => k.id), ...c.trees.map(t => t.id)].filter(id => runeIcon[id])
    .map(id => `<img class="rune" src="${runeIcon[id]}" alt="">`).join("") || "–";
  const games = c.log.slice(0, 14);
  const enemyRow = games.filter(g => g.enemy).map(g => champImg(g.enemy, g.win ? "w" : "l", `vs ${g.enemy} — ${g.win ? "win" : "loss"}`)).join("");
  const partnerLabel = PARTNER_LABEL[p.role];
  const partnerRow = partnerLabel ? games.filter(g => g.partner).map(g => champImg(g.partner, g.win ? "w" : "l", `${g.partner} — ${g.win ? "win" : "loss"}`)).join("") : "";
  return `<div class="th">${champImg(c.champion)}<div><b>${esc(c.champion)}</b><span>${esc(p.handle)} · ${esc(p.team)}</span></div></div>
    <div class="row"><span class="k">Games</span><span>${c.games}</span></div>
    <div class="row"><span class="k">Win / Loss</span><span class="${wcl}">${c.wins}-${c.games - c.wins} (${pct(c.wins, c.games)}%)</span></div>
    <div class="row"><span class="k">KDA</span><span>${c.kills} / ${c.deaths} / ${c.assists} <span class="sub">(${c.kda})</span></span></div>
    <div class="row"><span class="k">Avg gold diff @15</span><span>${gd}</span></div>
    <div class="row"><span class="k">CS / min</span><span>${c.csPerMin}</span></div>
    <div class="row"><span class="k">Runes</span><span class="icons">${runes}</span></div>
    ${enemyRow ? `<div class="sec">Matchups (each game)</div><div class="gicons">${enemyRow}</div>` : ""}
    ${partnerRow ? `<div class="sec">${partnerLabel} (each game)</div><div class="gicons">${partnerRow}</div>` : ""}`;
}

grid.addEventListener("mousemove", e => {
  const el = e.target.closest(".ch");
  if (!el) { tip.style.display = "none"; return; }
  const p = DATA.players[+el.dataset.p], c = p.champions[+el.dataset.c];
  tip.innerHTML = tipHtml(p, c);
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 16, innerWidth - tip.offsetWidth - 10) + "px";
  tip.style.top = Math.min(e.clientY + 16, innerHeight - tip.offsetHeight - 10) + "px";
});
grid.addEventListener("mouseleave", () => tip.style.display = "none");
["role", "sort", "team", "q"].forEach(id => document.getElementById(id).addEventListener(id === "q" ? "input" : "change", render));
render();
</script>
</body>
</html>
